<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISEPAM — ISEPAM — Usuários</title>
    <script>const t=localStorage.getItem('tema')||'light';document.documentElement.setAttribute('data-theme',t);</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>Patrimônio</h2>
            <p id="usuario-nome">Carregando...</p>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="dashboard.html">Dashboard</a>
            <a class="nav-item" href="inventario.html">Inventário</a>
            <a class="nav-item" href="cadastrar-bem.html">Cadastrar</a>
            <a class="nav-item" href="chamados.html">Chamados</a>
            <a class="nav-item" href="manutencoes.html">Manutenções</a>
            <a class="nav-item" href="consultas.html">Consultas</a>
            <a class="nav-item" href="relatorios.html">Relatórios</a>
            <a class="nav-item active" href="usuarios.html">Usuários</a>
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" onclick="alternarTema()">Modo Escuro</button>
            <a class="nav-item sair" onclick="sair()">Sair</a>
        </div>
    </aside>

    <main class="main">
      <div class="content-wrap">

        <div class="page-topo">
            <h1 class="page-title">Usuários</h1>
            <button class="btn-save" id="btn-novo-usuario" type="button">+ Novo usuário</button>
        </div>

        <div class="table-card">
            <div class="table-filters">
                <input type="text" id="filtro-usuario" placeholder="Buscar por nome ou e-mail" />
            </div>
            <div class="tabela-rolagem">
            <table>
                <thead><tr>
                    <th>Nome</th><th>E-mail</th><th>CPF</th><th>Telefone</th>
                    <th>Perfil</th><th>Chamados abertos</th><th class="coluna-acoes">Ações</th>
                </tr></thead>
                <tbody id="corpo-usuarios"><tr class="empty-row"><td colspan="7">Carregando...</td></tr></tbody>
            </table>
            </div>
        </div>
      </div>
    </main>
</div>

<script src="script.js"></script>
<script src="modulos.js"></script>
</body>
</html>
