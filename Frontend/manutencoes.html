<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISEPAM — ISEPAM — Manutenções</title>
    <script>const t=localStorage.getItem('tema')||'light';document.documentElement.setAttribute('data-theme',t);</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>Patrimônio</h2>
            <p id="usuario-nome">Carregando...</p>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="dashboard.html">Dashboard</a>
            <a class="nav-item" href="inventario.html">Inventário</a>
            <a class="nav-item" href="cadastrar-bem.html">Cadastrar</a>
            <a class="nav-item" href="chamados.html">Chamados</a>
            <a class="nav-item active" href="manutencoes.html">Manutenções</a>
            <a class="nav-item" href="consultas.html">Consultas</a>
            <a class="nav-item" href="relatorios.html">Relatórios</a>
            <a class="nav-item" href="usuarios.html">Usuários</a>
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" onclick="alternarTema()">Modo Escuro</button>
            <a class="nav-item sair" onclick="sair()">Sair</a>
        </div>
    </aside>

    <main class="main">
      <div class="content-wrap">

        <div class="page-topo">
            <h1 class="page-title">Manutenções</h1>
            <button class="btn-save" id="btn-nova-manutencao" type="button">+ Nova manutenção</button>
        </div>

        <div class="cards-grid mini-cards">
            <div class="card"><div class="card-number" id="man-total">–</div><div class="card-label">Registradas</div></div>
            <div class="card"><div class="card-number" id="man-andamento">–</div><div class="card-label">Em andamento</div></div>
            <div class="card"><div class="card-number" id="man-custo">–</div><div class="card-label">Custo total</div></div>
        </div>

        <div class="filtros-chamado" id="filtros-manutencao">
            <button class="filtro-btn active" data-situacao="">Todas</button>
            <button class="filtro-btn" data-situacao="andamento">Em andamento</button>
            <button class="filtro-btn" data-situacao="concluida">Concluídas</button>
        </div>

        <div class="table-card" style="margin-top:16px;">
            <div class="tabela-rolagem">
            <table>
                <thead><tr>
                    <th>#</th><th>Equipamento</th><th>Problema (chamado)</th><th>Técnico</th>
                    <th>Início</th><th>Fim</th><th>Custo</th><th class="coluna-acoes">Ações</th>
                </tr></thead>
                <tbody id="corpo-manutencoes"><tr class="empty-row"><td colspan="8">Carregando...</td></tr></tbody>
            </table>
            </div>
        </div>
      </div>
    </main>
</div>

<script src="script.js"></script>
<script src="modulos.js"></script>
</body>
</html>
